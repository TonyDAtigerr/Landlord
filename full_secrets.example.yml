# BBOT secrets.yml template - EVERY secret option BBOT 3.x knows about
#
# This mirrors what `bbot --reset-secrets` generates (every config option BBOT
# marks sensitive), but with every entry UNCOMMENTED and filled with an
# obviously fake placeholder, plus a comment saying what each one is for.
#
# How to use it:
#   1. Replace the FAKE values you actually have with real keys.
#   2. DELETE (or comment out) every entry you do not have a real value for.
#      A fake value is worse than none: a module with a bad key fails its
#      API check, and a fake interactsh_token / bbot_io_api_key breaks every scan.
#   3. Install it where BBOT reads it and lock it down:
#        cp full_secrets.example.yml ~/.config/bbot/secrets.yml
#        chmod 600 ~/.config/bbot/secrets.yml
#
# Only need the free API keys? Use free_secrets.example.yml instead.
# To regenerate BBOT's own (fully commented) version:  bbot --reset-secrets
#
# Generated from BBOT 3.0.2 source: every `Field(..., sensitive=True)` option.
# Option names match `bbot --list-module-options`.

# --------------------------------------------------------------------------
# Global options (top level, not under modules:)
# --------------------------------------------------------------------------

# API key for bbot.io services
bbot_io_api_key: 'FAKE-BBOT-IO-KEY-REPLACE-ME'

# Auth token for a self-hosted / authenticated interactsh server
interactsh_token: 'FAKE-INTERACTSH-TOKEN-REPLACE-ME'

# Cookies sent with every HTTP request (name: value)
http_cookies:
  session: 'FAKE-COOKIE-VALUE-REPLACE-ME'

modules:

  # ========================================================================
  # Scan modules - FREE tier available
  # (same set as free_secrets.example.yml)
  # ========================================================================

  # BeVigil OSINT API Key - https://bevigil.com/osint-api
  bevigil:
    api_key: 'FAKE-BEVIGIL-KEY-REPLACE-ME'

  # Builtwith API key - https://api.builtwith.com/
  builtwith:
    api_key: 'FAKE-BUILTWITH-KEY-REPLACE-ME'

  # Censys.io API Key in the format of 'key:secret' - https://search.censys.io/account/api
  # Tip: a single `censys: {api_key: ...}` section is shared by both modules.
  censys_dns:
    api_key: 'FAKE-CENSYS-ID-REPLACE-ME:FAKE-CENSYS-SECRET-REPLACE-ME'
  censys_ip:
    api_key: 'FAKE-CENSYS-ID-REPLACE-ME:FAKE-CENSYS-SECRET-REPLACE-ME'

  # SSLMate API key (enables pagination and higher rate limits) - https://sslmate.com/account/api_credentials
  # Optional: the module works without a key.
  certspotter:
    api_key: 'FAKE-CERTSPOTTER-KEY-REPLACE-ME'

  # Chaos API key - https://cloud.projectdiscovery.io
  chaos:
    api_key: 'FAKE-CHAOS-KEY-REPLACE-ME'

  # FullHunt API Key - https://fullhunt.io/user/settings/
  fullhunt:
    api_key: 'FAKE-FULLHUNT-KEY-REPLACE-ME'

  # Github token - https://github.com/settings/tokens (classic token, no scopes needed)
  # Tip: BBOT pools keys from every section whose name starts with "git", so one
  # `github: {api_key: ...}` section covers all five modules below.
  git_clone:
    api_key: 'FAKE-GITHUB-TOKEN-REPLACE-ME'
  github_codesearch:
    api_key: 'FAKE-GITHUB-TOKEN-REPLACE-ME'
  github_org:
    api_key: 'FAKE-GITHUB-TOKEN-REPLACE-ME'
  github_usersearch:
    api_key: 'FAKE-GITHUB-TOKEN-REPLACE-ME'
  github_workflows:
    api_key: 'FAKE-GITHUB-TOKEN-REPLACE-ME'

  # GitLab access token (for gitlab.com/org only) - https://gitlab.com/-/user_settings/personal_access_tokens
  gitlab_com:
    api_key: 'FAKE-GITLAB-TOKEN-REPLACE-ME'

  # GitLab access token (for self-hosted instances only)
  gitlab_onprem:
    api_key: 'FAKE-GITLAB-ONPREM-TOKEN-REPLACE-ME'

  # Hunter.IO API key - https://hunter.io/api-keys
  hunterio:
    api_key: 'FAKE-HUNTERIO-KEY-REPLACE-ME'

  # LeakIX API Key - https://leakix.net/settings/api
  leakix:
    api_key: 'FAKE-LEAKIX-KEY-REPLACE-ME'

  # OTX API key - https://otx.alienvault.com/api
  otx:
    api_key: 'FAKE-OTX-KEY-REPLACE-ME'

  # Postman API Key - https://go.postman.co/settings/me/api-keys
  # Tip: a single `postman: {api_key: ...}` section is shared by both modules.
  postman:
    api_key: 'FAKE-POSTMAN-KEY-REPLACE-ME'
  postman_download:
    api_key: 'FAKE-POSTMAN-KEY-REPLACE-ME'

  # SecurityTrails API key - https://securitytrails.com/app/account/credentials
  securitytrails:
    api_key: 'FAKE-SECURITYTRAILS-KEY-REPLACE-ME'

  # Trickest API key - https://trickest.io (account settings -> API keys)
  trickest:
    api_key: 'FAKE-TRICKEST-KEY-REPLACE-ME'

  # VirusTotal API Key - https://www.virustotal.com/gui/my-apikey
  virustotal:
    api_key: 'FAKE-VIRUSTOTAL-KEY-REPLACE-ME'

  # ========================================================================
  # Scan modules - PAID / private services
  # ========================================================================

  # BufferOverrun API key - https://tls.bufferover.run
  bufferoverrun:
    api_key: 'FAKE-BUFFEROVERRUN-KEY-REPLACE-ME'

  # c99.nl API key - https://api.c99.nl (accepts a list of keys)
  c99:
    api_key: 'FAKE-C99-KEY-REPLACE-ME'

  # Credshed username / password (self-hosted credential database)
  credshed:
    username: 'FAKE-CREDSHED-USERNAME-REPLACE-ME'
    password: 'FAKE-CREDSHED-PASSWORD-REPLACE-ME'

  # DeHashed API Key - https://www.dehashed.com
  dehashed:
    api_key: 'FAKE-DEHASHED-KEY-REPLACE-ME'

  # IP2location.io API Key - https://www.ip2location.io
  ip2location:
    api_key: 'FAKE-IP2LOCATION-KEY-REPLACE-ME'

  # IPStack GeoIP API Key - https://ipstack.com
  ipstack:
    api_key: 'FAKE-IPSTACK-KEY-REPLACE-ME'

  # Shodan API key - https://account.shodan.io
  shodan_dns:
    api_key: 'FAKE-SHODAN-KEY-REPLACE-ME'
  shodan_enterprise:
    api_key: 'FAKE-SHODAN-ENTERPRISE-KEY-REPLACE-ME'

  # SubDomainRadar.io API key - https://subdomainradar.io
  subdomainradar:
    api_key: 'FAKE-SUBDOMAINRADAR-KEY-REPLACE-ME'

  # Trajan (CI/CD + artifact repo enumeration) - per-platform tokens
  trajan:
    github_token: 'FAKE-GITHUB-TOKEN-REPLACE-ME'          # GitHub API token for rate-limiting and private repo access
    gitlab_token: 'FAKE-GITLAB-TOKEN-REPLACE-ME'          # GitLab API token for private repo access
    ado_token: 'FAKE-AZURE-DEVOPS-PAT-REPLACE-ME'         # Azure DevOps Personal Access Token (PAT)
    jfrog_token: 'FAKE-JFROG-TOKEN-REPLACE-ME'            # JFrog API token
    jenkins_username: 'FAKE-JENKINS-USERNAME-REPLACE-ME'  # Jenkins username for basic auth
    jenkins_password: 'FAKE-JENKINS-PASSWORD-REPLACE-ME'  # Jenkins password for basic auth
    jenkins_token: 'FAKE-JENKINS-TOKEN-REPLACE-ME'        # Jenkins API token

  # ========================================================================
  # Output modules - only used when you enable them with `-om <module>`
  # URLs below are BBOT's defaults; credentials are placeholders.
  # ========================================================================

  # Discord webhook URL
  discord:
    webhook_url: 'https://discord.com/api/webhooks/FAKE-REPLACE-ME'

  # Elasticsearch
  elastic:
    url: 'https://localhost:9200/bbot_events/_doc'   # Elastic URL (e.g. https://localhost:9200/<your_index>/_doc)
    username: 'elastic'                              # Elastic username
    password: 'FAKE-ELASTIC-PASSWORD-REPLACE-ME'     # Elastic password

  # MongoDB
  mongo:
    uri: 'mongodb://localhost:27017'                 # The URI of the MongoDB server
    username: 'FAKE-MONGO-USERNAME-REPLACE-ME'       # The username to use to connect to the database
    password: 'FAKE-MONGO-PASSWORD-REPLACE-ME'       # The password to use to connect to the database

  # MySQL
  mysql:
    username: 'root'                                 # The username to connect to MySQL
    password: 'FAKE-MYSQL-PASSWORD-REPLACE-ME'       # The password to connect to MySQL

  # Neo4j
  neo4j:
    uri: 'bolt://localhost:7687'                     # Neo4j server + port
    username: 'neo4j'                                # Neo4j username
    password: 'FAKE-NEO4J-PASSWORD-REPLACE-ME'       # Neo4j password

  # Postgres
  postgres:
    username: 'postgres'                             # The username to connect to Postgres
    password: 'FAKE-POSTGRES-PASSWORD-REPLACE-ME'    # The password to connect to Postgres

  # RabbitMQ connection URL
  rabbitmq:
    url: 'amqp://FAKE-USER:FAKE-PASSWORD@localhost/'

  # Slack webhook URL
  slack:
    webhook_url: 'https://hooks.slack.com/services/FAKE-REPLACE-ME'

  # Splunk HTTP Event Collector
  splunk:
    url: 'https://splunk.example.com:8088/services/collector'   # Web URL
    hectoken: 'FAKE-SPLUNK-HEC-TOKEN-REPLACE-ME'                # HEC Token

  # Microsoft Teams webhook URL
  teams:
    webhook_url: 'https://example.webhook.office.com/webhookb2/FAKE-REPLACE-ME'

  # Generic HTTP webhook output
  webhook:
    bearer: 'FAKE-BEARER-TOKEN-REPLACE-ME'           # Authorization Bearer token
    password: 'FAKE-BASIC-AUTH-PASSWORD-REPLACE-ME'  # Password (basic auth)
    headers: {}                                      # Additional headers to send with the request

  # WebSocket output
  websocket:
    url: 'wss://example.com/bbot'                    # Web URL
    token: 'FAKE-WEBSOCKET-TOKEN-REPLACE-ME'         # Authorization Bearer token
