# BBOT secrets.yml template - FREE API keys only
# (see full_secrets.example.yml for every option BBOT supports)
#
# Every key below has a free tier. Replace each FAKE value with your real key,
# then copy this file to ~/.config/bbot/secrets.yml and lock it down:
#
#   cp free_secrets.example.yml ~/.config/bbot/secrets.yml
#   chmod 600 ~/.config/bbot/secrets.yml
#
# Values here are placeholders and will not work. Never commit a real secrets.yml.
#
# Have a PAID key for a module that is not listed here (Shodan, DeHashed,
# BufferOverrun, c99, ...)? Use full_secrets.example.yml in this repo, or
# generate BBOT's own full template, which lists every module option:
#
#   bbot --reset-secrets        # regenerates ~/.config/bbot/secrets.yml
#                               # (backs up the old one to secrets.yml.bak)
#
# Tested against BBOT 3.x. Option names come from `bbot --list-module-options`.

modules:

  # VirusTotal - https://www.virustotal.com/gui/my-apikey
  virustotal:
    api_key: 'FAKE-VIRUSTOTAL-KEY-REPLACE-ME'

  # ProjectDiscovery Chaos - https://cloud.projectdiscovery.io (API key in settings)
  chaos:
    api_key: 'FAKE-CHAOS-KEY-REPLACE-ME'

  # AlienVault OTX - https://otx.alienvault.com/api
  otx:
    api_key: 'FAKE-OTX-KEY-REPLACE-ME'

  # GitHub - https://github.com/settings/tokens
  # Classic token with NO scopes is enough. Paste the same token into each of
  # the five GitHub modules (BBOT rejects a shared "github:" section).
  github_codesearch:
    api_key: 'FAKE-GITHUB-TOKEN-REPLACE-ME'
  github_org:
    api_key: 'FAKE-GITHUB-TOKEN-REPLACE-ME'
  github_usersearch:
    api_key: 'FAKE-GITHUB-TOKEN-REPLACE-ME'
  github_workflows:
    api_key: 'FAKE-GITHUB-TOKEN-REPLACE-ME'
  git_clone:
    api_key: 'FAKE-GITHUB-TOKEN-REPLACE-ME'

  # SecurityTrails - https://securitytrails.com/app/account/credentials
  securitytrails:
    api_key: 'FAKE-SECURITYTRAILS-KEY-REPLACE-ME'

  # Censys - https://search.censys.io/account/api
  # Format is 'API_ID:API_SECRET' in one string. Same value in both modules.
  censys_dns:
    api_key: 'FAKE-CENSYS-ID-REPLACE-ME:FAKE-CENSYS-SECRET-REPLACE-ME'
  censys_ip:
    api_key: 'FAKE-CENSYS-ID-REPLACE-ME:FAKE-CENSYS-SECRET-REPLACE-ME'

  # LeakIX - https://leakix.net/settings/api
  leakix:
    api_key: 'FAKE-LEAKIX-KEY-REPLACE-ME'

  # BeVigil - https://bevigil.com/osint-api
  bevigil:
    api_key: 'FAKE-BEVIGIL-KEY-REPLACE-ME'

  # FullHunt - https://fullhunt.io/user/settings/
  fullhunt:
    api_key: 'FAKE-FULLHUNT-KEY-REPLACE-ME'

  # BuiltWith - https://api.builtwith.com/
  builtwith:
    api_key: 'FAKE-BUILTWITH-KEY-REPLACE-ME'

  # hunter.io - https://hunter.io/api-keys
  hunterio:
    api_key: 'FAKE-HUNTERIO-KEY-REPLACE-ME'

  # Postman - https://go.postman.co/settings/me/api-keys
  # Shared by the postman and postman_download modules.
  postman:
    api_key: 'FAKE-POSTMAN-KEY-REPLACE-ME'

  # Trickest - https://trickest.io (account settings -> API keys)
  trickest:
    api_key: 'FAKE-TRICKEST-KEY-REPLACE-ME'

  # Cert Spotter (SSLMate) - https://sslmate.com/account/api_credentials
  # Works without a key; a key raises the rate limit and enables pagination.
  certspotter:
    api_key: 'FAKE-CERTSPOTTER-KEY-REPLACE-ME'

  # GitLab (gitlab.com only) - https://gitlab.com/-/user_settings/personal_access_tokens
  # Personal access token with the read_api scope.
  gitlab_com:
    api_key: 'FAKE-GITLAB-TOKEN-REPLACE-ME'
